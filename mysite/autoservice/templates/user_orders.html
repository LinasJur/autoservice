{% extends 'base.html' %}

{% block title %} Mano užsakymai {% endblock %}

{% block content %}

<h1> Užsakymai </h1>
{% for order in orders %}
<a href="{% url 'order' order.pk %}" class="{% if order.is_overdue %}text-danger{% endif %}">
    <p><b> Automobilis </b> {{ order.car }} </p>
</a>

<p><b> Serviso statusas </b> {{ order.get_status_display }} </p>
<hr>
{% endfor %}
{% endblock %}
